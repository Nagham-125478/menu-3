<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنيو</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-whatsapp="0785522491" data-cliq="0785522491">

    <!-- الهيدر العصري -->
    <header class="main-header">
        <div class="header-overlay"></div>
        <div class="header-content">
            <h1 class="restaurant-name">قائمة الطعام</h1>
                
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن صنف، سندويشة، أو مشروب...">
            </div>
        </div>
    </header>

    <!-- شريط الأقسام السريع -->
    <nav class="categories-nav">
        <button class="nav-btn active" onclick="filterCategory('all', event)"><i class="fa-solid fa-border-all"></i> الكل</button>
        <button class="nav-btn" onclick="filterCategory('main', event)"><i class="fa-solid fa-star"></i> الأطباق الرئيسية</button>
        <button class="nav-btn" onclick="filterCategory('hot', event)"><i class="fa-solid fa-fire"></i> الساخن</button>
        <button class="nav-btn" onclick="filterCategory('grill', event)"><i class="fa-solid fa-drumstick-bite"></i> المشاوي</button>
        <button class="nav-btn" onclick="filterCategory('sandwiches', event)"><i class="fa-solid fa-burger"></i> السندويشات</button>
        <button class="nav-btn" onclick="filterCategory('salads', event)"><i class="fa-solid fa-carrot"></i> السلطات</button>
        <button class="nav-btn" onclick="filterCategory('drinks', event)"><i class="fa-solid fa-glass-water"></i> المشروبات</button>
    </nav>

    <!-- عرض الكروت -->
    <main class="menu-container" id="menuContainer"></main>

    <!-- زر السلة العائم السريع مع المجموع -->
    <button class="cart-floating-btn" onclick="toggleCart()">
        <div class="cart-btn-inner">
            <span class="cart-badge" id="cartCount">0</span>
            <i class="fa-solid fa-basket-shopping"></i>
            <span>سلة الطلبات</span>
        </div>
    </button>

    <!-- نافذة السلة الجانبية -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h2><i class="fa-solid fa-cart-flatbed"></i> تفاصيل السلة</h2>
                <button class="close-btn" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="cart-items" id="cartItemsContainer">
                <p class="empty-msg">السلة فارغة حالياً</p>
            </div>

            <div class="cart-footer">
                <div class="total-price-bar">
                    <span>المجموع الإجمالي:</span>
                    <span id="totalAmount">0.00 د.أ</span>
                </div>
                
                <div id="checkoutSection">
                    <label for="paymentMethod" class="checkout-label">اختر طريقة الدفع المفضلة:</label>
                    <select id="paymentMethod" onchange="handlePaymentChange()" class="custom-select">
                        <option value="cash">💵 نقداً (عند الاستلام)</option>
                        <option value="cliq">📱 كليك (CliQ)</option>
                    </select>

                    <div id="cliqNotice" class="cliq-box">
                        <div class="cliq-header">
                            <i class="fa-solid fa-circle-check"></i>
                            <b>تفاصيل التحويل السريع (CliQ):</b>
                        </div>
                        <div class="cliq-details">
                            <!-- النص مشفر للعرض، والرقم الحقيقي محفوظ في data-full-num -->
                            <span>الرقم: <b id="cliqNum" data-full-num="0785522491">078***2491</b></span>
                            <button type="button" onclick="copyCliqNumber()" class="copy-btn">
                                <i class="fa-regular fa-copy"></i> نسخ
                            </button>
                        </div>
                        <small class="cliq-sub">* يرجى إرفاق وصل التحويل بالدردشة بعد إرسال الطلب.</small>
                    </div>

                    <button class="whatsapp-btn" onclick="sendToWhatsApp()">
                        <i class="fa-brands fa-whatsapp"></i> إرسال الطلب عبر الواتساب
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
